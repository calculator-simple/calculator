<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0f" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>Simple</title>
<style>
:root{
  --bg:#f4f4f6;--surface:#fff;--surface-2:#efeff3;--text:#111114;--muted:#6c6c75;--border:rgba(17,17,20,.08);
  --accent:#2563eb;--accent-contrast:#fff;--accent-soft:rgba(37,99,235,.10);--danger:#d23b3b;--success:#1f9d55;
  --key:#fff;--key-fn:#e9e9ee;--key-op:#e8eefc;--key-op-text:#1d4ed8;
  --mine:#dbe7ff;--mine-text:#0b1b3f;--seen:#0a84ff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.07);
  --radius:20px;--radius-sm:12px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0c0f;--surface:#16161b;--surface-2:#1f1f26;--text:#f2f2f5;--muted:#9a9aa5;--border:rgba(255,255,255,.08);
  --accent:#4f8cff;--accent-soft:rgba(79,140,255,.15);--key:#1c1c22;--key-fn:#2a2a32;--key-op:#1e2944;--key-op-text:#93b4ff;
  --mine:#22335c;--mine-text:#eef3ff;--seen:#5ab8ff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.visually-hidden{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

#app{height:var(--app-height,100dvh);display:flex;flex-direction:column;position:relative}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--st) var(--sr) 0 var(--sl)}
.screen.is-entering{animation:screen-in .2s var(--ease)}
@keyframes screen-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen-inner{width:100%;max-width:var(--max-width,520px);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column}
#screen-chat,#screen-notes{--max-width:760px}

.topbar{height:60px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px}
.topbar-title{flex:1;min-width:0;margin:0;font-size:1.1rem;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-title:focus{outline:none}
.icon-btn{min-width:44px;height:44px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;transition:background-color .15s var(--ease),transform .1s var(--ease)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{transform:scale(.96)}
.icon-btn:disabled{opacity:.4}
.icon-btn svg{width:22px;height:22px;flex:none}
.icon-btn.small{min-width:36px;height:36px;padding:0}
.icon-btn.small svg{width:18px;height:18px}
.icon-btn .label{font-size:.95rem;font-weight:600}
.shell-header{border-bottom:1px solid var(--border);background:var(--bg)}

/* calculator */
.calc{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px calc(16px + var(--sb))}
.calc-display{flex:1;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:6px;padding:12px 8px 20px;text-align:right;overflow:hidden}
.calc-expr{min-height:1.4em;max-width:100%;font-size:1.05rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-main{max-width:100%;font-size:clamp(2.4rem,11vw,4rem);font-weight:300;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-variant-numeric:tabular-nums}
.calc-main::-webkit-scrollbar{display:none}
.calc-main.is-long{font-size:clamp(1.8rem,8vw,2.8rem)}
.calc-main.is-xlong{font-size:clamp(1.4rem,6vw,2rem)}
.calc-main.is-error{font-size:clamp(1.6rem,7vw,2.4rem);color:var(--danger)}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{height:clamp(52px,8.4dvh,72px);border-radius:18px;background:var(--key);box-shadow:var(--shadow-sm);border:1px solid var(--border);font-size:1.45rem;font-weight:450;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s var(--ease),filter .15s var(--ease)}
.key:active{transform:scale(.95);filter:brightness(.94)}
.key-fn{background:var(--key-fn);font-size:1.2rem}
.key-op{background:var(--key-op);color:var(--key-op-text);font-size:1.6rem}
.key-equals{grid-column:1/-1;background:var(--accent);color:var(--accent-contrast);border-color:transparent;font-size:1.6rem}
@media (prefers-color-scheme:dark){.key:active{filter:brightness(1.25)}}

/* panel */
.panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px 20px calc(32px + var(--sb))}
.panel-card{width:100%;display:flex;align-items:center;gap:18px;padding:26px 22px;text-align:left;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);transition:transform .12s var(--ease)}
.panel-card:active{transform:scale(.985)}
.panel-card-icon{width:56px;height:56px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.panel-card-icon svg{width:28px;height:28px}
.panel-card-text{display:flex;flex-direction:column;gap:3px;flex:1}
.panel-card-title{font-size:1.25rem;font-weight:650}
.panel-card-sub{font-size:.92rem;color:var(--muted)}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

/* shared blocks */
.shell-body{flex:1;min-height:0;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column}
.state-block{margin:auto;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted);padding:24px 8px}
.state-block h2{margin:0;font-size:1.05rem;font-weight:650;color:var(--text)}
.state-block p{margin:0;font-size:.95rem;line-height:1.45}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
.spinner.small{width:20px;height:20px;border-width:2.5px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.signin-form{display:flex;flex-direction:column;gap:14px;text-align:left}
.signin-form h2{margin:0;font-size:1.1rem;color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px}
.field span{font-size:.85rem;font-weight:550;color:var(--muted)}
.field input{height:46px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);font-size:1rem}
.form-error{min-height:1.2em;font-size:.88rem;color:var(--danger)}
.btn{height:44px;padding:0 18px;border-radius:var(--radius-sm);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s var(--ease),filter .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.btn-primary{background:var(--accent);color:var(--accent-contrast)}
.btn-quiet{background:var(--surface-2)}
.btn-danger{background:var(--danger);color:#fff}
.danger-text{color:var(--danger)}
.btn-chip{height:34px;padding:0 14px;border-radius:17px;background:var(--surface-2);font-size:.88rem;font-weight:600}
.btn-chip.primary{background:var(--accent);color:#fff}

/* chat */
.chat-identity{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.chat-identity .topbar-title{flex:none}
.chat-presence{font-size:.8rem;color:var(--muted);min-height:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-presence.online{color:var(--success)}
.chat-main{flex:1;min-height:0;display:flex;flex-direction:column}
.notice{margin:10px 12px 0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px;font-size:.9rem;line-height:1.4}
.notice-actions{display:flex;gap:8px;justify-content:flex-end}
.chat-wrap{position:relative;flex:1;min-height:0;display:flex}
.chat-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 8px;-webkit-overflow-scrolling:touch}
.older-loader{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:3;background:var(--surface);border-radius:50%;padding:6px;box-shadow:var(--shadow)}
.msg-list{display:flex;flex-direction:column;gap:3px}
.list-status{padding:24px 8px}
.day-sep{align-self:center;margin:12px 0 6px;padding:4px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:.76rem;font-weight:600}
.msg{display:flex;align-items:center;gap:4px;max-width:100%}
.msg.mine{flex-direction:row-reverse}
.msg.flash .bubble{animation:flash 1.2s var(--ease)}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.bubble{max-width:min(80%,520px);padding:7px 10px 5px;border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);min-width:64px}
.msg.mine .bubble{background:var(--mine);color:var(--mine-text);border-color:transparent}
.msg.kind-photo .bubble{padding:4px 4px 5px}
.bubble.bare{background:none!important;border:0;box-shadow:none;padding:0}
.text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.38;font-size:.98rem}
.tombstone{margin:0;font-style:italic;color:var(--muted);font-size:.92rem}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px;font-size:.7rem;color:var(--muted);padding:0 2px}
.msg.mine .meta{color:color-mix(in srgb,var(--mine-text) 60%,transparent)}
.bubble.bare .meta{background:var(--surface);border-radius:8px;padding:1px 6px;width:max-content;margin-left:auto}
.ticks{display:inline-flex}
.ticks svg{width:16px;height:12px}
.ticks.seen{color:var(--seen)}
.failed-text{color:var(--danger);font-weight:600}
.msg-more{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);opacity:0;flex:none;transition:opacity .15s}
.msg-more svg{width:18px;height:18px}
.msg:hover .msg-more,.msg-more:focus-visible{opacity:1}
@media (hover:none){.msg-more{display:none}.bubble{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.quote{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;margin:1px 0 6px;padding:6px 9px;border-radius:10px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--text) 6%,transparent);font-size:.82rem}
.quote-who{font-weight:650;color:var(--accent)}
.quote-text{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery{display:grid;gap:3px;border-radius:14px;overflow:hidden;width:min(264px,64vw)}
.thumb{position:relative;aspect-ratio:1;background:var(--surface-2);overflow:hidden;display:block;width:100%}
.gallery.single .thumb{aspect-ratio:4/3;max-height:340px}
.thumb img,.sticker-img img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .2s}
.thumb.loaded img,.sticker-img.loaded img{opacity:1}
.thumb.broken::after,.sticker-img.broken::after{content:"Unavailable";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
.stickers{display:flex;flex-wrap:wrap;gap:6px;max-width:300px}
.msg.mine .stickers{justify-content:flex-end}
.sticker-img{position:relative;width:96px;height:96px}
.sticker-img img{object-fit:contain}
.file-card{display:flex;align-items:center;gap:10px;min-width:200px;max-width:280px;padding:8px 6px;text-align:left;border-radius:12px}
.file-card svg{width:30px;height:30px;flex:none;color:var(--accent)}
.file-info{display:flex;flex-direction:column;min-width:0}
.file-name{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-sub{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-missing{font-size:.85rem;color:var(--muted);padding:6px}
.progress{height:3px;margin-top:6px;border-radius:2px;background:var(--border);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.msg.pending .bubble{opacity:.9}
.pending-actions{display:flex;gap:6px}
.new-pill{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;padding:8px 14px;border-radius:999px;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;box-shadow:var(--shadow)}
.composer-context{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--border);background:var(--bg)}
.context-text{flex:1;min-width:0;display:flex;flex-direction:column;border-left:3px solid var(--accent);padding-left:10px}
.context-label{font-size:.8rem;font-weight:650;color:var(--accent)}
.context-snippet{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer{flex:none;display:flex;align-items:flex-end;gap:4px;padding:8px 10px calc(8px + var(--sb));border-top:1px solid var(--border);background:var(--bg)}
.composer textarea{flex:1;min-height:44px;max-height:140px;resize:none;padding:11px 14px;border-radius:22px;border:1px solid var(--border);background:var(--surface);font-size:1rem;line-height:1.35}
.send-btn{width:44px;height:44px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff}
.send-btn svg{width:20px;height:20px}
.send-btn:disabled{opacity:.4}
.char-count{position:absolute;right:66px;bottom:calc(58px + var(--sb));font-size:.72rem;color:var(--muted)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s var(--ease)}
.overlay.show{opacity:1}
.sheet{width:min(560px,100%);max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + var(--sb));box-shadow:var(--shadow);transform:translateY(24px);transition:transform .2s var(--ease)}
.overlay.show .sheet{transform:none}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:22px;padding-bottom:16px}}
.sheet-title{font-weight:650;font-size:1.02rem;margin:4px 4px 12px}
.sheet-actions{display:flex;flex-direction:column;gap:6px}
.sheet-action{height:50px;border-radius:14px;background:var(--surface-2);font-weight:600;text-align:left;padding:0 16px;display:flex;align-items:center;gap:12px}
.sheet-action svg{width:20px;height:20px;color:var(--accent)}
.sheet-action.danger{color:var(--danger)}
.sheet-action.cancel{justify-content:center;margin-top:8px;background:none}
.confirm h2{margin:4px 4px 8px;font-size:1.08rem}
.confirm p{margin:0 4px 16px;color:var(--muted);line-height:1.45;font-size:.94rem}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.preview-cell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.preview-cell img{width:100%;height:100%;object-fit:cover}
.preview-noimg{font-size:.75rem;color:var(--muted);padding:6px;word-break:break-all;text-align:center}
.preview-remove{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.preview-remove svg{width:14px;height:14px}
.preview-note{color:var(--danger);font-size:.88rem;margin:10px 4px 0}
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;max-height:44dvh;overflow:auto;padding:2px}
.sticker-choice{position:relative;aspect-ratio:1;border-radius:14px;background:var(--surface-2);padding:8px;border:2px solid transparent}
.sticker-choice svg{width:100%;height:100%}
.sticker-choice.on{border-color:var(--accent);background:var(--accent-soft)}
.sticker-strip{display:flex;gap:6px;min-height:48px;align-items:center;overflow-x:auto;margin-top:10px;padding:4px;border-radius:12px;background:var(--surface-2);font-size:.85rem;color:var(--muted)}
.sticker-strip svg{width:40px;height:40px;flex:none}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}
.lb-btn{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-btn svg{width:24px;height:24px}
.lb-close{top:calc(var(--st) + 12px);right:12px}
.lb-prev{left:12px;top:50%;transform:translateY(-50%)}
.lb-next{right:12px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;top:calc(var(--st) + 24px);left:16px;color:#fff;font-size:.9rem}

/* notes */
.notes-main{flex:1;min-height:0;display:flex;flex-direction:column}
.notes-list-view{flex:1;min-height:0;overflow-y:auto;padding:12px 14px calc(16px + var(--sb))}
.notes-list{display:flex;flex-direction:column;gap:10px}
.note-item{width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px}
.note-item[aria-busy="true"]{opacity:.6}
.note-title{font-weight:650;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-meta{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;color:var(--muted)}
.note-timer{color:var(--accent);white-space:nowrap}
.note-editor{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 14px calc(12px + var(--sb));gap:8px}
.note-title-input{height:48px;border:0;border-bottom:1px solid var(--border);background:none;font-size:1.25rem;font-weight:650;padding:0 4px}
.note-title-input:focus{outline:none;border-bottom-color:var(--accent)}
.note-content{flex:1;min-height:160px;border:0;background:none;resize:none;font-size:1rem;line-height:1.55;padding:8px 4px}
.note-content:focus{outline:none}
.note-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px}
.note-info{font-size:.78rem;color:var(--muted);line-height:1.5}
.note-actions{display:flex;gap:8px}

.conn-banner{position:absolute;top:calc(var(--st) + 8px);left:50%;transform:translateX(-50%);z-index:60;padding:7px 14px;border-radius:999px;font-size:.82rem;font-weight:600;background:var(--text);color:var(--bg);box-shadow:var(--shadow);white-space:nowrap}
.toasts{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{max-width:100%;padding:11px 16px;border-radius:14px;background:var(--text);color:var(--bg);font-size:.92rem;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;white-space:pre-line}
.toast.show{opacity:1;transform:none}
.toast-error{background:var(--danger);color:#fff}
.toast-success{background:var(--success);color:#fff}

@media (min-width:720px){

          <button class="key" type="button" data-key="9">9</button>

   6. OVERLAYS: sheets, confirm dialogs, lightbox
   ===================================================================== */
const UI = (() => {
  const stack = [];
  function open(content, { label = 'Dialog', onClose } = {}) {
    const panel = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': label }, content);
    const backdrop = h('div', { class: 'overlay' }, panel);
    const entry = { backdrop, onClose, prev: document.activeElement };
    backdrop.addEventListener('click', e => { if (e.target === backdrop) close(entry); });
    $('#overlayLayer').append(backdrop);
    stack.push(entry);
    requestAnimationFrame(() => backdrop.classList.add('show'));

    if (f) f.focus({ preventScroll: true });
    return { close: () => close(entry), panel };
  }
  function close(entry) {

    stack.splice(i, 1);

  }

  function closeTop() { if (stack.length) { close(stack[stack.length - 1]); return true; } return false; }
  function isOpen() { return stack.length > 0; }

    let handle;
    const list = h('div', { class: 'sheet-actions' });
    for (const it of items) {
      const b = h('button', { class: `sheet-action${it.danger ? ' danger' : ''}`, type: 'button' }, it.icon ? svgEl(it.icon) : null, it.label);
      b.addEventListener('click', () => { handle.close(); it.onSelect(); });
      list.append(b);
    }
    const cancel = h('button', { class: 'sheet-action cancel', type: 'button' }, 'Cancel');
    cancel.addEventListener('click', () => handle.close());
    handle = open(h('div', {}, title ? h('div', { class: 'sheet-title', text: title }) : null, list, cancel), { label: title || 'Actions' });
  }
  function confirm({ title, text, confirmLabel = 'OK', danger = false }) {
    return new Promise(resolve => {
      let decided = false, handle;
      const done = v => { if (decided) return; decided = true; handle.close(); resolve(v); };
      const no = h('button', { class: 'btn btn-quiet', type: 'button' }, 'Cancel');
      const ok = h('button', { class: `btn ${danger ? 'btn-danger' : 'btn-primary'}`, type: 'button' }, confirmLabel);
      no.addEventListener('click', () => done(false)); ok.addEventListener('click', () => done(true));
      handle = open(h('div', { class: 'confirm' }, h('h2', { text: title }), text ? h('p', { text }) : null, h('div', { class: 'confirm-actions' }, no, ok)),
        { label: title, onClose: () => { if (!decided) { decided = true; resolve(false); } } });
    });
  }
  function info({ title, text, actions = [] }) {
    let handle;
    const btns = actions.map(a => { const b = h('button', { class: `btn ${a.primary ? 'btn-primary' : 'btn-quiet'}`, type: 'button' }, a.label); b.addEventListener('click', () => { handle.close(); a.onSelect && a.onSelect(); }); return b; });
    const closeBtn = h('button', { class: 'btn btn-quiet', type: 'button' }, 'Close'); closeBtn.addEventListener('click', () => handle.close());
    handle = open(h('div', { class: 'confirm' }, h('h2', { text: title }), h('p', { text }), h('div', { class: 'confirm-actions' }, closeBtn, ...btns)), { label: title });
  }
  return { open, closeAll, closeTop, isOpen, actionSheet, confirm, info };
})();

  function show(list, start) { items = list.slice(); index = Math.max(0, Math.min(start, items.length - 1)); if (!items.length) return; openState = true; el().hidden = false; $('#lbClose').focus({ preventScroll: true }); paint(); }
  function close() { if (!openState) return; openState = false; el().hidden = true; $('#lbImg').removeAttribute('src'); items = []; }
  function step(d) { const n = index + d; if (n < 0 || n >= items.length) return; index = n; paint(); }
  function mount() {
    $('#lbClose').addEventListener('click', close);
    $('#lbPrev').addEventListener('click', () => step(-1));
    $('#lbNext').addEventListener('click', () => step(1));
    el().addEventListener('click', e => { if (e.target === el()) close(); });
    el().addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    el().addEventListener('touchend', e => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });
    document.addEventListener('keydown', e => { if (!openState) return; if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); });
  }
  return { show, close, mount, isOpen: () => openState };
})();

/* =====================================================================
   7. NAVIGATION  Calculator → Panel → Chat | Notes (History API)
   Fresh launch always starts at the locked calculator.
   ===================================================================== */
const Nav = (() => {
  function show(name, sub = null, { focus = false } = {}) {
    if (!SCREENS[name]) name = 'home';
    if (name !== 'home' && !state.unlocked) { name = 'home'; sub = null; }
    UI.closeAll(); Lightbox.close();
    const prev = state.currentScreen, prevSub = state.currentSub;
    for (const [key, info] of Object.entries(SCREENS)) {
      const s = document.getElementById(info.section);
      if (key === name && s.hidden) { s.hidden = false; s.classList.remove('is-entering'); void s.offsetWidth; s.classList.add('is-entering'); }
      else if (key !== name) s.hidden = true;
    }
    state.currentScreen = name; state.currentSub = sub;
    if (name === 'home') lock();
    if (focus) { const t = document.getElementById(SCREENS[name].title); if (t) t.focus({ preventScroll: true }); }
    App.onScreenChange(name, sub, prev, prevSub);
  }
  function lock() { state.unlocked = false; $('#panelUnlockBtn').hidden = true; }
  function reveal() { state.unlocked = true; $('#panelUnlockBtn').hidden = false; }
  function go(target, sub = null) {
    const cur = state.currentScreen;
    if (!SCREENS[target] || (target !== 'home' && !state.unlocked)) return;
    if (target === cur) {
      if (sub === state.currentSub) return;
      if (sub) { history.pushState({ screen: target, sub }, ''); show(target, sub); } else history.back();
      return;
    }
    if (SCREENS[target].parent === cur && !state.currentSub) { history.pushState({ screen: target, sub }, ''); show(target, sub, { focus: true }); }
    else if (SCREENS[cur].parent === target) history.back();
    else { history.replaceState({ screen: target, sub }, ''); show(target, sub, { focus: true }); }
  }
  function back() { if (state.currentSub || SCREENS[state.currentScreen].parent) history.back(); }
  function goHome() { history.replaceState({ screen: 'home' }, ''); show('home'); }
  function init() {
    history.replaceState({ screen: 'home' }, '');
    show('home');
    window.addEventListener('popstate', e => {
      const s = e.state;
      let name = s && SCREENS[s.screen] ? s.screen : 'home', sub = s && s.sub ? s.sub : null;
      if (name !== 'home' && !state.unlocked) { history.replaceState({ screen: 'home' }, ''); name = 'home'; sub = null; }
      show(name, sub, { focus: true });
    });
  }
  return { init, go, back, goHome, reveal, lock };
})();

/* =====================================================================
   8. AUTH / SESSION (Supabase Auth is the only identity source)
   ===================================================================== */
const Auth = (() => {
  let currentUserId = null;
  async function init() {
    if (!isConfigured()) return setStatus('unconfigured');
    if (!window.supabase || typeof window.supabase.createClient !== 'function') return setStatus('error', 'Unable to load app services. Check your connection and retry.');
    setStatus('loading');
    try {
      if (!sb) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
        // Never await Supabase calls inside this callback.
        sb.auth.onAuthStateChange((event, session) => applySession(session, event));
      }
      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      applySession(data.session, 'GET_SESSION');
    } catch (e) { setStatus('error', friendlyError(e, 'Unable to check your session. Please retry.')); }
  }
  function applySession(session, event) {
    state.session = session || null;
    const id = session && session.user ? session.user.id : null;
    if (event === 'TOKEN_REFRESHED' && session) Realtime.refreshAuth(session.access_token);
    if (id !== currentUserId) {
      const had = currentUserId !== null;
      currentUserId = id;
      state.user = session ? session.user : null;
      if (had) { App.onSignedOut(); if (!session) toast('Your session ended. Please sign in again.'); }
      setStatus(session ? 'signed_in' : 'signed_out');
      if (session) setTimeout(() => App.onSignedIn(), 0);
    } else {
      state.user = session ? session.user : null;
      const s = session ? 'signed_in' : 'signed_out';
      if (state.auth.status !== s) setStatus(s);
    }
  }
  function setStatus(status, error = null) { state.auth.status = status; state.auth.error = error; App.renderGates(); }
  async function signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; }
  return { init, signIn };
})();

/* =====================================================================
   9. APP ORCHESTRATION
   ===================================================================== */
function stateBlock({ spinner = false, title = '', text = '', actions = [] } = {}) {
  return h('div', { class: 'state-block' }, spinner ? h('div', { class: 'spinner', 'aria-hidden': 'true' }) : null, title ? h('h2', { text: title }) : null, text ? h('p', { text }) : null, ...actions);
}
const App = {
  renderGates() {
    const { status, error } = state.auth, signedIn = status === 'signed_in';
    for (const [g, m] of [['chatGate', 'chatMain'], ['notesGate', 'notesMain']]) {
      const gate = document.getElementById(g);
      gate.hidden = signedIn; document.getElementById(m).hidden = !signedIn;
      if (signedIn) continue;
      let c;
      if (status === 'loading') c = stateBlock({ spinner: true, text: 'Checking your session…' });
      else if (status === 'unconfigured') c = stateBlock({ title: 'Setup required', text: 'Add your Supabase project URL and public key at the top of the script in index.html.' });
      else if (status === 'error') c = stateBlock({ title: 'Unable to connect', text: error || 'Something went wrong.', actions: [h('button', { class: 'btn btn-quiet', type: 'button', 'data-action': 'retry-init' }, 'Retry')] });
      else c = document.getElementById('tpl-signin').content.cloneNode(true);

    }
    $('#chatMenuBtn').hidden = !signedIn;
    Notes.renderHeader();
    Chat.renderHeader();
  },
  onSignedIn() {
    this.renderGates();
    if (state.unlocked) this.enterCurrent();
  },
  onSignedOut() {
    Realtime.disconnect(); Chat.reset(); Notes.reset(); SignedUrls.clear();
    state.conversation = null; state.partner = null; state.unreadCount = 0;
    Panel.renderBadge(); Chat.renderHeader();
  },
  enterCurrent() {
    const n = state.currentScreen;
    if (n === 'panel') Panel.enter(); else if (n === 'chat') Chat.enter(); else if (n === 'notes') Notes.enter(state.currentSub);
  },
  onScreenChange(name, sub, prev, prevSub) {
    if (prev === 'chat' && name !== 'chat') Chat.leave();
    if (prev === 'notes' && prevSub === 'editor' && !(name === 'notes' && sub === 'editor')) Notes.leaveEditor();
    if (name === 'panel') Panel.enter();
    else if (name === 'chat') Chat.enter();
    else if (name === 'notes') Notes.enter(sub);
    Connection.render();
  }
};

const Panel = {
  async enter() {
    if (state.auth.status !== 'signed_in') return;
    try { await Conversation.load(); Chat.refreshUnread(); } catch (e) { console.error(e); } // details shown inside Chat
  },
  renderBadge() {
    const b = $('#chatBadge'), n = state.unreadCount;
    b.hidden = !n; b.textContent = n > 99 ? '99+' : String(n);
    b.setAttribute('aria-label', `${n} unread`);
  }
};

/* =====================================================================
   10. CONVERSATION DISCOVERY (never created by the client)
   ===================================================================== */
const Conversation = (() => {
  let loading = null;
  function load() {
    if (state.conversation) return Promise.resolve(state.conversation);
    if (!loading) loading = doLoad().finally(() => { loading = null; });
    return loading;
  }
  async function doLoad() {
    const uid = state.user.id;
    const { data: mine, error: e1 } = await sb.from('conversation_members').select('conversation_id').eq('user_id', uid).limit(1);
    if (e1) throw e1;
    if (!mine || !mine.length) throw codeError('no_conversation');
    const convId = mine[0].conversation_id;
    const { data: members, error: e2 } = await sb.from('conversation_members').select('user_id').eq('conversation_id', convId);
    if (e2) throw e2;
    const partnerId = (members || []).map(m => m.user_id).find(id => id !== uid);
    if (!partnerId) throw codeError('no_partner');
    const { data: profiles, error: e3 } = await sb.from('profiles').select('id,display_name,last_seen_at').in('id', [uid, partnerId]);
    if (e3) throw e3;
    if (!state.user || state.user.id !== uid) throw codeError('auth');
    state.conversation = { id: convId };
    state.partner = (profiles || []).find(p => p.id === partnerId) || { id: partnerId, display_name: '', last_seen_at: null };
    Chat.renderHeader();
    Realtime.connect();
    LastSeen.start();
    Chat.backfillDelivered();
    Push.syncSilently();
    return state.conversation;
  }
  async function refreshPartner() {
    if (!state.partner) return;
    const { data } = await sb.from('profiles').select('id,display_name,last_seen_at').eq('id', state.partner.id).maybeSingle();
    if (data) { state.partner = data; Chat.renderHeader(); }
  }
  return { load, refreshPartner };
})();

/* =====================================================================
   11. REALTIME — one PRIVATE channel "conversation:<id>"
   Postgres Changes (RLS-filtered) + Presence (online) + Broadcast (typing)
   ===================================================================== */
const Realtime = (() => {
  let channel = null, typingTimer = null, offlineCheck = null;
  function refreshAuth(token) { if (!sb || !token) return; try { Promise.resolve(sb.realtime.setAuth(token)).catch(e => console.warn(e)); } catch (e) { console.warn(e); } }
  function connect() {
    if (!sb || !state.conversation || !state.user) return;
    disconnect();
    refreshAuth(state.session && state.session.access_token);
    const convId = state.conversation.id, filter = `conversation_id=eq.${convId}`;
    channel = sb.channel(`conversation:${convId}`, { config: { private: true, presence: { key: state.user.id }, broadcast: { self: false } } });
    channel
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter }, p => Chat.onRemoteInsert(p.new))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter }, p => Chat.onRemoteUpdate(p.new))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => Chat.onRemoteDelete(p.old))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'message_attachments', filter }, p => Chat.onAttachmentChange(p))
      .on('presence', { event: 'sync' }, onPresenceSync)
      .on('broadcast', { event: 'typing' }, ({ payload }) => onTyping(payload))
      .subscribe((status, err) => {
        if (err) console.warn('realtime', status, err);
        if (status === 'SUBSCRIBED') {
          const wasReconnecting = state.realtimeStatus === 'reconnecting';
          state.realtimeStatus = 'connected';
          if (document.visibilityState === 'visible') track();
          if (wasReconnecting || state.messagesLoaded) Chat.reconcile();
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') state.realtimeStatus = 'reconnecting';
        else if (status === 'CLOSED') state.realtimeStatus = 'closed';
        Connection.render();
      });
    state.realtimeChannel = channel;
  }
  function disconnect() {
    clearTimeout(typingTimer); clearTimeout(offlineCheck);
    if (channel && sb) { try { sb.removeChannel(channel); } catch (e) { console.warn(e); } }
    channel = null; state.realtimeChannel = null; state.realtimeStatus = 'idle';
    state.presence.partnerOnline = false; state.typing.partnerTyping = false;
  }
  function track() { if (channel && state.realtimeStatus === 'connected') channel.track({ online_at: new Date().toISOString() }).catch(() => {}); }
  function untrack() { if (channel && state.realtimeStatus === 'connected') channel.untrack().catch(() => {}); }
  function onPresenceSync() {
    if (!channel || !state.partner) return;
    const ps = channel.presenceState();
    const online = Boolean(ps[state.partner.id] && ps[state.partner.id].length);
    const wentOffline = state.presence.partnerOnline && !online;
    state.presence.partnerOnline = online;
    if (!online) state.typing.partnerTyping = false;
    Chat.renderHeader();
    if (wentOffline) { clearTimeout(offlineCheck); offlineCheck = setTimeout(() => Conversation.refreshPartner().catch(() => {}), 1500); }
  }
  function onTyping(payload) {
    if (!payload || !state.partner || payload.user_id !== state.partner.id) return;
    state.typing.partnerTyping = Boolean(payload.typing);
    clearTimeout(typingTimer);
    if (state.typing.partnerTyping) typingTimer = setTimeout(() => { state.typing.partnerTyping = false; Chat.renderHeader(); }, 5000);
    Chat.renderHeader();
  }
  function sendTyping(isTyping) {
    if (!channel || state.realtimeStatus !== 'connected') return;
    channel.send({ type: 'broadcast', event: 'typing', payload: { user_id: state.user.id, typing: isTyping } }).catch(() => {});
  }
  return { connect, disconnect, refreshAuth, track, untrack, sendTyping };
})();

/* =====================================================================
   12. PRIVATE STORAGE ACCESS — short-lived signed URLs, batched
   ===================================================================== */
const SignedUrls = (() => {
  const cache = new Map(); let queue = new Map(), timer = null;
  function get(path) {
    const c = cache.get(path);
    if (c && c.exp - Date.now() > 60000) return Promise.resolve(c.url);
    return new Promise((resolve, reject) => {
      if (!queue.has(path)) queue.set(path, []);
      queue.get(path).push({ resolve, reject });
      clearTimeout(timer); timer = setTimeout(flush, 30);
    });
  }
  async function flush() {
    const batch = queue; queue = new Map();
    const paths = [...batch.keys()]; if (!paths.length) return;
    try {
      const { data, error } = await sb.storage.from(APP.bucket).createSignedUrls(paths, APP.signedUrlTtl);
      if (error) throw error;
      const byPath = new Map((data || []).map(d => [d.path, d]));
      for (const p of paths) {
        const d = byPath.get(p), ws = batch.get(p);
        if (d && d.signedUrl && !d.error) { cache.set(p, { url: d.signedUrl, exp: Date.now() + APP.signedUrlTtl * 1000 }); ws.forEach(w => w.resolve(d.signedUrl)); }
        else ws.forEach(w => w.reject(codeError('unavailable')));
      }
    } catch (e) { for (const ws of batch.values()) ws.forEach(w => w.reject(e)); }
  }
  return { get, invalidate: p => cache.delete(p), clear: () => cache.clear() };
})();

/* =====================================================================
   13. ATTACHMENT HELPERS — validation + authenticated upload with progress
   ===================================================================== */
const Attach = (() => {
  function resolveMime(file) {
    let t = String(file.type || '').toLowerCase().split(';')[0].trim();
    if (t === 'image/jpg') t = 'image/jpeg';
    if (t && MIME_RE.test(t)) return t;
    const ext = String(file.name || '').toLowerCase().split('.').pop();
    return EXT_MIME[ext] || 'application/octet-stream';
  }
  function sanitizeName(name) {
    const n = String(name || '').replace(/[\u0000-\u001f\u007f/\\]/g, '_').trim().slice(0, 255);
    return n || 'file';
  }
  function extFor(item) {
    const parts = item.name.toLowerCase().split('.');
    const e = parts.length > 1 ? parts.pop() : '';
    if (/^[a-z0-9]{1,8}$/.test(e)) return e;
    return MIME_EXT[item.mime] || 'bin';
  }
  async function imageSize(file) {
    try { if ('createImageBitmap' in window) { const b = await createImageBitmap(file); const r = { width: b.width, height: b.height }; if (b.close) b.close(); return r; } } catch { /* e.g. HEIC on non-Safari */ }
    return null;
  }
  async function makeItem(blob, name, mime) {
    const item = { id: uuid(), blob, name: sanitizeName(name), mime, size: blob.size, previewUrl: mime.startsWith('image/') ? URL.createObjectURL(blob) : null, width: null, height: null, path: null, loaded: 0 };
    if (mime.startsWith('image/')) { const d = await imageSize(blob); if (d) { item.width = d.width; item.height = d.height; } }
    return item;
  }
  function revoke(items) { (items || []).forEach(i => { if (i.previewUrl) { URL.revokeObjectURL(i.previewUrl); i.previewUrl = null; } }); }
  // Direct authenticated POST to the Storage API (same call the SDK makes) so we can report progress.
  async function upload(path, blob, contentType, onProgress) {
    const { data } = await sb.auth.getSession();
    const token = data && data.session && data.session.access_token;
    if (!token) throw codeError('auth');
    const url = `${SUPABASE_URL.replace(/\/+$/, '')}/storage/v1/object/${APP.bucket}/${path.split('/').map(encodeURIComponent).join('/')}`;
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', url);
      xhr.setRequestHeader('Authorization', `Bearer ${token}`);
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Content-Type', contentType);
      xhr.setRequestHeader('x-upsert', 'false');
      xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) return resolve();
        console.error('storage upload', xhr.status, xhr.responseText);
        if (xhr.status === 413) return reject(codeError('too_large'));
        if (xhr.status === 401) return reject(codeError('auth'));
        reject(codeError('storage_denied'));
      };
      xhr.onerror = () => reject(codeError('network'));
      xhr.send(blob);
    });
  }
  return { resolveMime, sanitizeName, extFor, makeItem, revoke, upload };
})();

/* =====================================================================
   14. LAST SEEN (touch_last_seen RPC, throttled)
   ===================================================================== */
const LastSeen = (() => {
  let lastAt = 0, interval = null;
  function touch(force = false) {
    if (!sb || state.auth.status !== 'signed_in' || !state.conversation) return;
    const now = Date.now(); if (!force && now - lastAt < 60000) return;
    lastAt = now;
    sb.rpc('touch_last_seen').then(({ error }) => { if (error) console.warn(error); });
  }
  function start() { touch(true); if (!interval) interval = setInterval(() => { if (document.visibilityState === 'visible') touch(); }, 120000); }
  return { touch, start };
})();

/* =====================================================================
   15. CHAT
   ===================================================================== */
const Chat = (() => {
  let listEl, scrollEl, inputEl, sendBtn, active = false, stick = true, busy = false, reconciling = false, noticeDismissed = false;
  const els = new Map(), pendEls = new Map(), replyCache = new Map(), visibleUnseen = new Set();
  let io = null, expiryTimer = null, deliveredTarget = 0, deliveredSent = 0, seenTarget = 0, seenSent = 0;
  const me = () => state.user && state.user.id;
  const partnerName = () => (state.partner && state.partner.display_name) || 'them';

  /* ---------- header / notice ---------- */
  function renderHeader() {
    const title = $('#chatTitle'), pres = $('#chatPresence');
    if (!state.partner || state.auth.status !== 'signed_in') { title.textContent = 'Chat'; pres.textContent = ''; pres.classList.remove('online'); return; }
    title.textContent = state.partner.display_name || 'Chat';
    let t;
    if (state.typing.partnerTyping) t = 'typing…';
    else if (state.presence.partnerOnline) t = 'Online';
    else if (state.partner.last_seen_at) t = `Last seen ${relativeDayTime(state.partner.last_seen_at)}`;
    else t = 'Offline';
    pres.textContent = t;
    pres.classList.toggle('online', state.presence.partnerOnline || state.typing.partnerTyping);
  }
  function renderNotice() {
    const box = $('#chatNotice'), show = !noticeDismissed && Push.canPrompt();
    box.hidden = !show; if (!show) { box.replaceChildren(); return; }
    box.replaceChildren(h('div', { class: 'notice' },
      h('span', { text: 'Turn on notifications to know when a message arrives. They only ever say “New message”.' }),
      h('div', { class: 'notice-actions' },
        h('button', { class: 'btn-chip', type: 'button', 'data-action': 'notif-later' }, 'Not now'),
        h('button', { class: 'btn-chip primary', type: 'button', 'data-action': 'notif-enable' }, 'Turn on'))));
  }
  function dismissNotice() { noticeDismissed = true; renderNotice(); }

  /* ---------- list helpers ---------- */
  function setStatus(content) { const s = $('#listStatus'); if (!content) { s.hidden = true; s.replaceChildren(); } else { s.hidden = false; s.replaceChildren(content); } }
  function updateEmpty() { if (state.messagesLoaded && !els.size && !pendEls.size) setStatus(stateBlock({ text: 'No messages yet.' })); else if (state.messagesLoaded) setStatus(null); }
  function normalizeSeparators() {
    listEl.querySelectorAll('.day-sep').forEach(n => n.remove());
    let lastKey = null;
    for (const node of Array.from(listEl.children)) {
      const key = node.dataset.day;
      if (key && key !== lastKey) { listEl.insertBefore(h('div', { class: 'day-sep', role: 'separator', text: dayLabel(new Date(node.dataset.ts)) }), node); lastKey = key; }
    }
    updateEmpty();
  }
  function insertConfirmedEl(el, seq) {
    const confirmed = listEl.querySelectorAll('.msg[data-seq]');
    for (let i = confirmed.length - 1; i >= 0; i--) { if (Number(confirmed[i].dataset.seq) < seq) { confirmed[i].after(el); return; } }
    const first = listEl.querySelector('.msg');
    if (first) listEl.insertBefore(el, first); else listEl.append(el);
  }
  const isNearBottom = () => scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 140;
  function scrollToBottom(smooth = false) { scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: smooth && !reducedMotion.matches ? 'smooth' : 'auto' }); stick = true; $('#newPill').hidden = true; }
  function onMediaLoaded() { if (stick && active) scrollToBottom(); }
  function oldestSeq() { let m = null; for (const x of state.messages.values()) if (m === null || x.seq < m) m = x.seq; return m; }

  /* ---------- rendering ---------- */
  function summary(m) {
    if (!m) return 'Message unavailable';
    if (m.deleted_for_everyone_at) return 'This message was deleted';
    if (m.kind === 'text') return truncate(m.body, 90);
    if (m.kind === 'photo') return 'Photo';
    if (m.kind === 'sticker') return 'Sticker';
    const a = m.attachments && m.attachments[0]; return a ? `File · ${a.original_name}` : 'File';
  }
  function replySource(id) { return state.messages.get(id) || replyCache.get(id) || null; }
  function renderQuote(id) {
    const src = replySource(id), gone = !src || isExpired(src.expires_at);
    const who = gone ? '' : (src.sender_id === me() ? 'You' : partnerName());
    return h('button', { class: 'quote', type: 'button', 'data-action': 'jump-to', 'data-target': id }, who ? h('span', { class: 'quote-who', text: who }) : null, h('span', { class: 'quote-text', text: gone ? 'Message unavailable' : summary(src) }));
  }
  function bindImage(img, path) {
    let retried = false;
    const box = img.parentElement;

  function openMenu() {

  async function openFile(m) {
    const a = m.attachments && m.attachments[0]; if (!a) return;
    try {
      const { data, error } = await sb.storage.from(APP.bucket).createSignedUrl(a.storage_path, 60, { download: a.original_name });
      if (error) throw error;
      const link = h('a', { href: data.signedUrl, rel: 'noopener', download: a.original_name });

  }
  function jumpTo(id) {

    el.scrollIntoView({ block: 'center', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  /* ---------- lifecycle ---------- */
  async function enter() {
    active = true; renderHeader();
    if (state.auth.status !== 'signed_in') return;
    try { await Conversation.load(); }
    catch (e) { setStatus(stateBlock({ title: 'Unable to open chat', text: friendlyError(e, 'Please try again.'), actions: [h('button', { class: 'btn btn-quiet', type: 'button', 'data-action': 'retry-chat' }, 'Retry')] })); return; }
    if (state.currentScreen !== 'chat') return;

    if (!state.messagesLoaded) await loadInitial();

    maybeMarkSeen(); refreshUnread();
  }
  function leave() { active = false; Typing.stop(); }
  function onVisible() { if (!state.messagesLoaded) return; sweepExpired(); normalizeSeparators(); reconcile(); maybeMarkSeen(); }
  function onHidden() { Typing.stop(); }
  function reset() {
    active = false; flushDelivered.cancel(); flushSeen.cancel(); clearTimeout(expiryTimer);
    for (const p of state.pending.values()) Attach.revoke(p.items);
    state.pending.clear(); pendEls.clear(); replyCache.clear();
    if (listEl) resetList();
    state.messagesLoaded = false; state.hasMoreOlder = true;
    deliveredTarget = deliveredSent = seenTarget = seenSent = 0;
    state.replyingTo = null; state.editingMessage = null;
    if (inputEl) { inputEl.value = ''; renderContext(); }
    setStatus(null);
  }
  function retry() { if (!state.conversation) enter(); else loadInitial(); }

  function mount() {
    listEl = $('#msgList'); scrollEl = $('#msgScroll'); inputEl = $('#chatInput'); sendBtn = $('#sendBtn');
    io = new IntersectionObserver(entries => {
      for (const e of entries) {

    $('#chatComposer').addEventListener('submit', e => { e.preventDefault(); submit(); });
    inputEl.addEventListener('input', () => { autoresize(); updateSend(); if (!state.editingMessage) Typing.input(); });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !coarsePointer.matches) { e.preventDefault(); submit(); } });
    // long-press (touch) / right-click (desktop) opens message actions

    });
    listEl.addEventListener('pointermove', e => { if (lp && !lp.fired && (Math.abs(e.clientX - lp.x) > 10 || Math.abs(e.clientY - lp.y) > 10)) { clearTimeout(lp.timer); lp = null; } });

    listEl.addEventListener('contextmenu', e => { const m = e.target.closest('.msg[data-id]'); if (!m) return; e.preventDefault(); openActions(m.dataset.id); });
  }

  return {
    mount, enter, leave, reset, retry, onVisible, onHidden, renderHeader, renderNotice, dismissNotice,
    onRemoteInsert, onRemoteUpdate, onRemoteDelete, onAttachmentChange, reconcile, refreshUnread, backfillDelivered,
    sendAttachments, retryPending, discardPending, cancelContext, openActions, openMenu, openAttachMenu, jumpTo,
    msg: id => state.messages.get(id), openFile, scrollToBottom, keepBottom: () => { if (active && stick) scrollToBottom(); }
  };
})();

/* =====================================================================
   16. ATTACHMENT PICKING: validation → preview → Cancel / Send
   ===================================================================== */
const Picker = (() => {
  let handle = null, sent = false;
  function clearSelection() { Attach.revoke(state.selected.items); state.selected = { kind: null, items: [] }; }
  async function addPhotos(files) {
    if (!files.length) return;
    const cur = state.selected.kind === 'photo' ? state.selected.items : (clearSelection(), []);
    const problems = [], accepted = [];
    for (const f of files) {
      const mime = Attach.resolveMime(f);
      if (!PHOTO_MIME.has(mime)) problems.push(`${f.name || 'File'}: not a supported photo type`);
      else if (f.size > APP.maxAttachmentBytes) problems.push(`${f.name || 'Photo'}: larger than 25 MB`);
      else if (!f.size) problems.push(`${f.name || 'Photo'}: file is empty`);
      else accepted.push({ f, mime });
    }
    if (problems.length) toast(problems.slice(0, 3).join('\n'), 'error', 5000);
    const items = await Promise.all(accepted.map(({ f, mime }) => Attach.makeItem(f, f.name || 'photo', mime)));
    state.selected = { kind: 'photo', items: cur.concat(items) };
    if (state.selected.items.length) open(); else clearSelection();
  }
  async function pickFile(f) {
    if (!f) return;
    if (f.size > APP.maxAttachmentBytes) { toast('This file is too large (max 25 MB).', 'error'); return; }
    if (!f.size) { toast('This file is empty.', 'error'); return; }
    clearSelection();
    const item = await Attach.makeItem(f, f.name || 'file', Attach.resolveMime(f));
    if (item.previewUrl) { URL.revokeObjectURL(item.previewUrl); item.previewUrl = null; }
    state.selected = { kind: 'file', items: [item] };
    open();
  }
  function build() {
    const sel = state.selected, n = sel.items.length, over = sel.kind === 'photo' && n > APP.maxItems;
    const body = h('div');
    if (sel.kind === 'photo') {
      const grid = h('div', { class: 'preview-grid' });
      sel.items.forEach(it => grid.append(h('div', { class: 'preview-cell' },
        it.previewUrl ? h('img', { src: it.previewUrl, alt: it.name }) : h('span', { class: 'preview-noimg', text: it.name }),
        h('button', { class: 'preview-remove', type: 'button', 'aria-label': `Remove ${it.name}`, 'data-remove': it.id }, svgEl(ICON.close)))));
      body.append(grid);
      body.addEventListener('click', e => { const b = e.target.closest('[data-remove]'); if (b) removeItem(b.dataset.remove); });
    } else {
      const it = sel.items[0];
      body.append(h('div', { class: 'file-card' }, svgEl(ICON.file), h('span', { class: 'file-info' }, h('span', { class: 'file-name', text: it.name }), h('span', { class: 'file-sub', text: `${formatBytes(it.size)} · ${it.mime}` }))));
    }
    const cancel = h('button', { class: 'btn btn-quiet', type: 'button' }, 'Cancel');
    const send = h('button', { class: 'btn btn-primary', type: 'button', disabled: over || !n }, 'Send');
    cancel.addEventListener('click', () => handle && handle.close());
    send.addEventListener('click', () => {
      if (send.disabled) return; send.disabled = true; sent = true;
      const { kind, items } = state.selected; state.selected = { kind: null, items: [] };
      handle.close(); Chat.sendAttachments(kind, items);
    });
    const title = sel.kind === 'photo' ? (n === 1 ? 'Send photo' : `Send ${n} photos`) : 'Send file';
    return h('div', {}, h('div', { class: 'sheet-title', text: title }), body,
      over ? h('p', { class: 'preview-note', text: `Up to 10 photos per message. Remove ${n - APP.maxItems} to send.` }) : null,
      h('div', { class: 'confirm-actions' }, cancel, send));
  }
  function open() {
    if (handle) { handle.panel.replaceChildren(build()); return; }
    sent = false;
    handle = UI.open(build(), { label: 'Preview', onClose: () => { handle = null; if (!sent) clearSelection(); } });
  }
  function removeItem(id) {
    const sel = state.selected, it = sel.items.find(x => x.id === id);
    if (it) Attach.revoke([it]);
    sel.items = sel.items.filter(x => x.id !== id);
    if (!sel.items.length) { handle && handle.close(); return; }
    handle.panel.replaceChildren(build());
  }
  function openStickers() {
    const chosen = []; let h2 = null;
    const grid = h('div', { class: 'sticker-grid' });
    STICKERS.forEach(s => { const b = h('button', { class: 'sticker-choice', type: 'button', 'aria-pressed': 'false', 'aria-label': s.label, 'data-sticker': s.id }); b.append(stickerNode(s)); grid.append(b); });
    const strip = h('div', { class: 'sticker-strip', 'aria-live': 'polite' });
    const send = h('button', { class: 'btn btn-primary', type: 'button', disabled: true }, 'Send');
    const cancel = h('button', { class: 'btn btn-quiet', type: 'button' }, 'Cancel');
    const byId = id => STICKERS.find(s => s.id === id);
    function paint() {
      strip.replaceChildren(...(chosen.length ? chosen.map(id => stickerNode(byId(id))) : [h('span', { text: 'Select up to 10 stickers' })]));
      send.disabled = !chosen.length; send.textContent = chosen.length ? `Send (${chosen.length})` : 'Send';
      grid.querySelectorAll('.sticker-choice').forEach(b => { const on = chosen.includes(b.dataset.sticker); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    }
    grid.addEventListener('click', e => {
      const b = e.target.closest('[data-sticker]'); if (!b) return;
      const i = chosen.indexOf(b.dataset.sticker);
      if (i >= 0) chosen.splice(i, 1); else if (chosen.length < APP.maxItems) chosen.push(b.dataset.sticker); else toast('Up to 10 stickers per message.');
      paint();
    });
    cancel.addEventListener('click', () => h2.close());
    send.addEventListener('click', async () => {
      if (send.disabled) return; send.disabled = true;
      const list = chosen.map(byId); h2.close();
      try {
        const items = await Promise.all(list.map(async s => { const blob = await stickerBlob(s); return Attach.makeItem(blob, `${s.id}.png`, blob.type || 'image/png'); }));
        Chat.sendAttachments('sticker', items);
      } catch (e) { toast(friendlyError(e, 'Unable to prepare stickers.'), 'error'); }
    });
    h2 = UI.open(h('div', {}, h('div', { class: 'sheet-title', text: 'Stickers' }), grid, strip, h('div', { class: 'confirm-actions' }, cancel, send)), { label: 'Stickers' });
    paint();
  }
  function mount() {
    const onPhotos = e => { const files = Array.from(e.target.files || []); e.target.value = ''; addPhotos(files); };
    $('#inputCamera').addEventListener('change', onPhotos);
    $('#inputGallery').addEventListener('change', onPhotos);
    $('#inputFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; pickFile(f); });
  }
  return { mount, openStickers };
})();

/* =====================================================================
   17. NOTES (content only via open_note(); timers owned by the database)
   ===================================================================== */
const Notes = (() => {
  let dirty = false, saving = false, opening = false, loading = false, ticker = null;
  const titleEl = () => $('#noteTitle'), contentEl = () => $('#noteContent');
  function timerText(n) {
    if (!n.id) return 'Not saved yet';
    if (!n.expires_at) return n.first_opened_at ? '' : 'Not opened yet';
    return `Deletes in ${formatCountdown(Date.parse(n.expires_at) - serverNow())}`;
  }
  function renderHeader() {
    const editor = state.currentScreen === 'notes' && state.currentSub === 'editor';
    $('#notesTitle').textContent = editor ? (state.openNote && state.openNote.id ? 'Note' : 'New note') : 'Notes';
    $('#noteNewBtn').hidden = editor || state.auth.status !== 'signed_in';
  }
  function setStatus(c) { const s = $('#notesStatus'); if (!c) { s.hidden = true; s.replaceChildren(); } else { s.hidden = false; s.replaceChildren(c); } }
  function item(n) {
    return h('button', { class: 'note-item', type: 'button', 'data-note': n.id },
      h('span', { class: 'note-title', text: n.title || 'Untitled' }),
      h('span', { class: 'note-meta' }, h('span', { text: `Updated ${relativeDayTime(n.updated_at)}` }), h('span', { class: 'note-timer', 'data-timer': n.id, text: timerText(n) })));
  }
  function renderList() { $('#notesList').replaceChildren(...state.notes.map(item)); setStatus(state.notes.length ? null : stateBlock({ text: 'No notes yet.' })); }
  function showList() { $('#notesListView').hidden = false; $('#noteEditor').hidden = true; renderHeader(); }
  function renderInfo() {
    const n = state.openNote; if (!n) return;
    const parts = [];
    if (n.created_at) parts.push(`Created ${formatDateTime(n.created_at)}`);
    if (n.updated_at) parts.push(`Updated ${formatDateTime(n.updated_at)}`);
    const t = n.id && !n.expires_at && !n.first_opened_at ? 'Timer starts the first time it is opened' : timerText(n);
    if (t) parts.push(t);
    $('#noteInfo').replaceChildren(...parts.flatMap((p, i) => (i ? [h('br'), p] : [p])));
  }
  function showEditor() {
    const n = state.openNote;
    $('#notesListView').hidden = true; $('#noteEditor').hidden = false;
    titleEl().value = n.title || ''; contentEl().value = n.content || '';
    $('#noteDelete').hidden = !n.id; dirty = false; updateSave(); renderInfo(); renderHeader();
    if (!n.id) setTimeout(() => contentEl().focus(), 50);
  }
  function updateSave() { $('#noteSave').disabled = saving || !dirty; $('#noteSave').textContent = saving ? 'Saving…' : 'Save'; }
  async function loadList() {
    if (loading || !sb) return; loading = true;
    if (!state.notes.length) setStatus(stateBlock({ spinner: true, text: 'Loading notes…' }));
    try {
      const { data, error } = await sb.from('notes').select(NOTE_COLS).order('updated_at', { ascending: false });
      if (error) throw error;
      state.notes = (data || []).filter(n => !isExpired(n.expires_at)); renderList();
    } catch (e) { setStatus(stateBlock({ title: 'Unable to load notes', text: friendlyError(e, 'Please try again.'), actions: [h('button', { class: 'btn btn-quiet', type: 'button', 'data-action': 'retry-notes' }, 'Retry')] })); }
    finally { loading = false; }
  }
  function upsertListEntry(n) {
    const meta = { id: n.id, title: n.title, created_at: n.created_at, updated_at: n.updated_at, first_opened_at: n.first_opened_at, timer_started_at: n.timer_started_at, expires_at: n.expires_at };
    state.notes = [meta, ...state.notes.filter(x => x.id !== n.id)].sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at));
    renderList();
  }
  async function openNote(id, btn) {
    if (opening) return; opening = true; if (btn) btn.setAttribute('aria-busy', 'true');
    try {
      const { data, error } = await sb.rpc('open_note', { p_note_id: id }); // first open starts the 12h timer
      if (error) throw error;
      state.openNote = data; upsertListEntry(data); Nav.go('notes', 'editor');
    } catch (e) {
      toast(friendlyError(e, 'Unable to open this note.'), 'error');
      if (/not found/i.test(String(e && e.message))) { state.notes = state.notes.filter(n => n.id !== id); renderList(); }
    } finally { opening = false; if (btn) btn.removeAttribute('aria-busy'); }
  }
  function openNew() { state.openNote = { id: null, title: '', content: '', created_at: null, updated_at: null, first_opened_at: null, timer_started_at: null, expires_at: null }; Nav.go('notes', 'editor'); }
  async function save({ quiet = false } = {}) {
    const n = state.openNote; if (!n || saving) return false;
    const title = titleEl().value.trim().slice(0, 200) || null, content = contentEl().value;
    if (!n.id && !title && !content.trim()) { dirty = false; return true; }
    if (content.length > APP.maxNoteLength) { toast('This note is too long.', 'error'); return false; }
    saving = true; updateSave();
    try {
      if (!n.id) {
        const { error } = await sb.from('notes').insert({ title, content });
        if (error) throw error;
        // Content isn't selectable, so the new id can't be returned; fetch the newest note's metadata.
        const { data, error: e2 } = await sb.from('notes').select(NOTE_COLS).order('created_at', { ascending: false }).limit(1);
        if (e2) throw e2;
        if (data && data[0]) Object.assign(n, data[0]);
      } else {
        const { error } = await sb.from('notes').update({ title, content }).eq('id', n.id); // backend restarts a running timer
        if (error) throw error;
        const { data, error: e2 } = await sb.from('notes').select(NOTE_COLS).eq('id', n.id).maybeSingle();
        if (e2) throw e2;
        if (!data) throw codeError('note_gone');
        Object.assign(n, data);
      }
      n.title = title; n.content = content; dirty = false;
      if (n.id) upsertListEntry(n);
      if (state.openNote === n && state.currentSub === 'editor') { $('#noteDelete').hidden = !n.id; renderInfo(); renderHeader(); }
      if (!quiet) toast('Saved', 'success', 1600);
      return true;
    } catch (e) { toast(friendlyError(e, 'Unable to save the note.'), 'error'); return false; }
    finally { saving = false; updateSave(); }
  }
  async function del() {
    const n = state.openNote; if (!n || !n.id) return;
    const ok = await UI.confirm({ title: 'Delete note?', text: 'This note will be permanently deleted.', confirmLabel: 'Delete', danger: true });
    if (!ok) return;
    const { error } = await sb.from('notes').delete().eq('id', n.id);
    if (error) { toast(friendlyError(error, 'Unable to delete the note.'), 'error'); return; }
    state.notes = state.notes.filter(x => x.id !== n.id); dirty = false; state.openNote = null; renderList(); Nav.back();
  }
  function leaveEditor() {
    const wasDirty = dirty, n = state.openNote;
    if (wasDirty && n) save({ quiet: false }).finally(() => { if (state.openNote === n && state.currentSub !== 'editor') state.openNote = null; });
    else state.openNote = null;
    dirty = false;
  }
  function tick() {
    if (state.currentScreen !== 'notes') return;
    const before = state.notes.length;
    state.notes = state.notes.filter(n => !isExpired(n.expires_at));
    if (state.notes.length !== before) renderList();
    else state.notes.forEach(n => { const el = document.querySelector(`[data-timer="${n.id}"]`); if (el) el.textContent = timerText(n); });
    const o = state.openNote;
    if (o && o.expires_at && isExpired(o.expires_at) && state.currentSub === 'editor') { dirty = false; state.openNote = null; toast('This note has expired and was deleted.'); Nav.back(); }
    else if (o && state.currentSub === 'editor') renderInfo();
  }
  function enter(sub) {
    renderHeader();
    if (state.auth.status !== 'signed_in') return;
    if (!ticker) ticker = setInterval(tick, 30000);
    if (sub === 'editor') { if (!state.openNote) { history.replaceState({ screen: 'notes' }, ''); state.currentSub = null; showList(); loadList(); } else showEditor(); }
    else { showList(); loadList(); }
  }
  function reset() { state.notes = []; state.openNote = null; dirty = false; $('#notesList').replaceChildren(); setStatus(null); }
  function mount() {
    $('#notesList').addEventListener('click', e => { const b = e.target.closest('[data-note]'); if (b) openNote(b.dataset.note, b); });
    const mark = () => { dirty = true; updateSave(); };
    titleEl().addEventListener('input', mark); contentEl().addEventListener('input', mark);
    $('#noteEditor').addEventListener('submit', e => { e.preventDefault(); save(); });
    $('#noteDelete').addEventListener('click', del);
  }
  return { mount, enter, reset, renderHeader, leaveEditor, openNew, loadList, tick };
})();

/* =====================================================================
   18. WEB PUSH (service worker sw.js + register_push_subscription RPC)
   ===================================================================== */
const Push = (() => {
  let reg = null;
  const vapidReady = () => typeof VAPID_PUBLIC_KEY === 'string' && VAPID_PUBLIC_KEY.length > 40 && !VAPID_PUBLIC_KEY.includes('YOUR_');
  const supported = () => window.isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.matchMedia('(display-mode: standalone)').matches && !navigator.standalone;
  function canPrompt() { return supported() && vapidReady() && Notification.permission === 'default'; }
  function keyBytes(b64) { const pad = '='.repeat((4 - (b64.length % 4)) % 4); const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); }
  function sameKey(buf, bytes) { if (!buf) return false; const a = new Uint8Array(buf); return a.length === bytes.length && a.every((v, i) => v === bytes[i]); }
  async function registration() {
    if (reg) return reg;
    if (!('serviceWorker' in navigator) || !window.isSecureContext) return null;
    try { reg = await navigator.serviceWorker.register('./sw.js', { scope: './' }); } catch (e) { console.warn('service worker', e); reg = null; }
    return reg;
  }
  async function subscribe() {
    const r = await registration(); if (!r) throw codeError('push_unsupported');
    const key = keyBytes(VAPID_PUBLIC_KEY);
    let sub = await r.pushManager.getSubscription();
    if (sub && sub.options && sub.options.applicationServerKey && !sameKey(sub.options.applicationServerKey, key)) { await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    const j = sub.toJSON();
    const { error } = await sb.rpc('register_push_subscription', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_user_agent: String(navigator.userAgent || '').slice(0, 500) });
    if (error) throw error;
  }
  async function enable() {
    if (!supported() || !vapidReady()) { showSettings(); return; }
    let perm;
    try { perm = await Notification.requestPermission(); } catch { perm = Notification.permission; } // native browser prompt
    Chat.renderNotice();
    if (perm === 'granted') { try { await subscribe(); toast('Notifications are on', 'success'); } catch (e) { toast(friendlyError(e, 'Unable to turn on notifications.'), 'error'); } }
    else if (perm === 'denied') toast('Notifications are blocked. You can allow them in your browser’s site settings.', 'error', 5000);
  }
  function syncSilently() { if (supported() && vapidReady() && Notification.permission === 'granted' && sb && state.user) subscribe().catch(e => console.warn('push sync', e)); }
  function showSettings() {
    if (!supported()) return UI.info({ title: 'Notifications', text: isIOS() ? 'On iPhone, first add this app to your Home Screen (Share → Add to Home Screen), then open it from there to turn on notifications.' : 'This browser doesn’t support web notifications.' });
    if (!vapidReady()) return UI.info({ title: 'Notifications', text: 'Notifications are not configured yet (missing public VAPID key in index.html).' });
    const p = Notification.permission;
    if (p === 'denied') return UI.info({ title: 'Notifications are blocked', text: 'To turn them on, allow notifications for this site in your browser settings, then reopen the app.' });
    if (p === 'granted') return UI.info({ title: 'Notifications are on', text: 'You’ll get “New message” alerts. Message text is never included.', actions: [{ label: 'Refresh', primary: true, onSelect: () => subscribe().then(() => toast('Notifications refreshed', 'success')).catch(e => toast(friendlyError(e, 'Unable to refresh.'), 'error')) }] });
    UI.info({ title: 'Turn on notifications?', text: 'You’ll be alerted when a new message arrives. Alerts only say “New message” — never the message itself. Your browser will ask for permission next.', actions: [{ label: 'Continue', primary: true, onSelect: enable }] });
  }
  function init() {
    if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
    registration();
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open-home') Nav.goHome(); });
    if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
  }
  return { init, canPrompt, enable, syncSilently, showSettings };
})();

/* =====================================================================
   19. CONNECTION, VIEWPORT, VISIBILITY
   ===================================================================== */
const Connection = {
  render() {
    const b = $('#connBanner');
    let text = '';
    if (!navigator.onLine) text = 'You’re offline';
    else if (state.realtimeStatus === 'reconnecting' && state.currentScreen !== 'home') text = 'Reconnecting…';
    b.textContent = text; b.hidden = !text;
  },
  init() {
    window.addEventListener('online', () => { state.connection.online = true; Connection.render(); if (state.auth.status === 'error') Auth.init(); Chat.reconcile(); });
    window.addEventListener('offline', () => { state.connection.online = false; Connection.render(); });
    Connection.render();
  }
};
function initViewport() {
  const vv = window.visualViewport; if (!vv) return;
  const apply = () => { document.documentElement.style.setProperty('--app-height', `${Math.round(vv.height)}px`); if (vv.offsetTop) window.scrollTo(0, 0); Chat.keepBottom(); };
  vv.addEventListener('resize', apply); vv.addEventListener('scroll', () => { if (vv.offsetTop) window.scrollTo(0, 0); });
  apply();
}
function initVisibility() {
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { Realtime.track(); LastSeen.touch(); Chat.onVisible(); Notes.tick(); Chat.refreshUnread(); }
    else { Realtime.untrack(); LastSeen.touch(true); Chat.onHidden(); }
  });
  window.addEventListener('pagehide', () => LastSeen.touch(true));
}

/* =====================================================================
   20. GLOBAL EVENTS (delegation) + BOOT
   ===================================================================== */
function bindGlobalEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-action]'); if (!t || t.disabled) return;
    switch (t.dataset.action) {
      case 'go-panel': Nav.go('panel'); break;
      case 'open-chat': Nav.go('chat'); break;
      case 'open-notes': Nav.go('notes'); break;
      case 'back': Nav.back(); break;
      case 'retry-init': Auth.init(); break;
      case 'retry-chat': Chat.retry(); break;
      case 'retry-notes': Notes.loadList(); break;
      case 'note-new': Notes.openNew(); break;
      case 'chat-menu': Chat.openMenu(); break;
      case 'attach': Chat.openAttachMenu(); break;
      case 'stickers': Picker.openStickers(); break;
      case 'context-cancel': Chat.cancelContext(); break;
      case 'new-pill': Chat.scrollToBottom(true); break;
      case 'notif-enable': Chat.dismissNotice(); Push.enable(); break;
      case 'notif-later': Chat.dismissNotice(); break;
      case 'retry-pending': Chat.retryPending(t.dataset.cid); break;
      case 'discard-pending': Chat.discardPending(t.dataset.cid); break;
      case 'jump-to': Chat.jumpTo(t.dataset.target); break;
      case 'msg-more': { const m = t.closest('.msg[data-id]'); if (m) Chat.openActions(m.dataset.id); break; }
      case 'open-photo': { const m = Chat.msg(t.dataset.mid); if (m) Lightbox.show(m.attachments, Number(t.dataset.index)); break; }
      case 'open-file': { const m = Chat.msg(t.dataset.mid); if (m) Chat.openFile(m); break; }
      default: break;
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !Lightbox.isOpen()) UI.closeTop(); });
  document.addEventListener('submit', async e => {
    const form = e.target.closest('.signin-form'); if (!form) return;
    e.preventDefault();
    const email = form.elements.email.value.trim(), password = form.elements.password.value;
    const err = form.querySelector('.form-error'), btn = form.querySelector('button[type="submit"]');
    err.textContent = '';
    if (!email || !password) { err.textContent = 'Enter your email and password.'; return; }
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = 'Signing in…';
    try { await Auth.signIn(email, password); }
    catch (x) { err.textContent = friendlyError(x, 'Unable to sign in. Please try again.'); btn.disabled = false; btn.textContent = 'Sign in'; }
  });
}

function init() {
  Calculator.mount({
    onInput: () => { if (state.currentScreen === 'home' && state.unlocked) Nav.lock(); },
    onAccess: () => Nav.reveal()
  });
  Lightbox.mount(); Chat.mount(); Picker.mount(); Notes.mount();
  bindGlobalEvents(); Connection.init(); initViewport(); initVisibility();
  App.renderGates();
  Nav.init();
  Auth.init();
  Push.init();
}
init();
</script>
